<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Capital Engine — Five Year Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10151b;
    --panel:#161d25;
    --panel-2:#1b232d;
    --line:#2a323d;
    --text:#e9e4d8;
    --text-dim:#8b95a1;
    --brass:#c39a5b;
    --brass-dim:#8a713f;
    --good:#7a9b7e;
    --behind:#b0654f;
    --neutral:#5c6773;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Spectral', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  .app{ display:flex; min-height:100vh; }

  /* NAV */
  .nav{
    width:230px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:28px 0;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .nav-brand{
    padding:0 20px 22px 20px;
    border-bottom:1px solid var(--line);
    margin-bottom:10px;
  }
  .nav-brand .kicker{ color:var(--brass); font-size:11px; letter-spacing:.04em; }
  .nav-brand h1{ font-size:19px; margin:4px 0 0 0; line-height:1.25; font-weight:600; }
  .pillar-item{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:12px 20px;
    cursor:pointer;
    border-left:2px solid transparent;
    color:var(--text-dim);
  }
  .pillar-item .num{ font-family:'IBM Plex Mono', monospace; font-size:12px; padding-top:2px; }
  .pillar-item .name{ font-size:13.5px; line-height:1.35; }
  .pillar-item.active{ background:var(--panel-2); border-left:2px solid var(--brass); color:var(--text); }
  .pillar-item.active .num{ color:var(--brass); }
  .pillar-item.disabled{ opacity:.4; cursor:default; }
  .pillar-item:not(.disabled):hover{ background:var(--panel-2); }

  /* MAIN */
  .main{ flex:1; padding:44px 56px 80px 56px; max-width:980px; }
  .eyebrow{ color:var(--brass); font-size:12px; margin-bottom:6px; }
  .page-title{ font-size:34px; font-weight:600; margin:0 0 10px 0; }
  .page-sub{ color:var(--text-dim); max-width:640px; line-height:1.55; margin-bottom:36px; font-size:14.5px; }

  section{ margin-bottom:52px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:10px; }
  .section-head h2{ font-size:19px; margin:0; font-weight:600; }
  .section-note{ color:var(--text-dim); font-size:12.5px; }

  /* FLOW DIAGRAM */
  .flow{ display:flex; flex-direction:column; gap:0; }
  .flow-step{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }
  .flow-step .label{ font-size:13px; color:var(--text-dim); }
  .flow-step .value{ font-family:'IBM Plex Mono', monospace; font-size:15px; color:var(--text); }
  .flow-arrow{ text-align:center; color:var(--brass-dim); font-size:13px; padding:4px 0; }

  /* FREEDOM GAUGE */
  .gauge-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:28px 24px 20px 24px; display:flex; flex-direction:column; align-items:center; }
  .gauge-figures{ display:flex; justify-content:space-between; width:100%; max-width:420px; margin-top:6px; }
  .gauge-figures .cur{ text-align:left; }
  .gauge-figures .tgt{ text-align:right; }
  .gauge-figures .lbl{ font-size:11px; color:var(--text-dim); margin-bottom:3px; }
  .gauge-figures .val{ font-family:'IBM Plex Mono', monospace; font-size:16px; }
  .gauge-pct{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--brass); margin-top:10px; }

  /* CARDS */
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:18px; }
  .card .who{ font-size:12px; color:var(--text-dim); margin-bottom:10px; letter-spacing:.02em; }
  .field-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; font-size:13px; }
  .field-row .lbl{ color:var(--text-dim); }
  .field-row input{
    width:110px; text-align:right;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:5px 8px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:12.5px;
  }
  .field-row input:focus{ outline:none; border-color:var(--brass-dim); }

  /* MONTHLY DASHBOARD */
  .month-label{ font-size:12px; color:var(--brass); margin-bottom:2px; }
  .income-input-row{ display:flex; gap:14px; margin-bottom:24px; }
  .income-input-row .who-input{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:14px 16px; }
  .income-input-row label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:8px; }
  .income-input-row input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:9px 10px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:16px;
  }
  .income-input-row input:focus{ outline:none; border-color:var(--brass-dim); }
  .stat-big{ font-family:'IBM Plex Mono', monospace; font-size:22px; color:var(--text); margin-bottom:14px; }
  .split-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .split-row:last-child{ border-bottom:none; }
  .split-row .split-lbl{ color:var(--text-dim); }
  .split-row .split-lbl .tag{ color:var(--brass-dim); font-size:10.5px; margin-left:4px; }
  .split-row .split-val{ font-family:'IBM Plex Mono', monospace; }
  .combined-card{ border-color:var(--brass-dim); }
  .progress-track{ height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-top:10px; }
  .progress-fill{ height:100%; background:var(--good); transition:width .3s ease; }
  .progress-fill.behind{ background:var(--behind); }
  .progress-pct{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim); margin-top:5px; text-align:right; }

  /* TABLE */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:left; color:var(--text-dim); font-weight:500; font-size:11.5px; letter-spacing:.02em; padding:8px 10px; border-bottom:1px solid var(--line); }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  td.stage{ color:var(--brass); font-size:11.5px; }
  td input{
    width:100px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:5px 7px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:12px; text-align:right;
  }
  td input:focus{ outline:none; border-color:var(--brass-dim); }
  .num-cell{ font-family:'IBM Plex Mono', monospace; }
  .variance-pos{ color:var(--good); }
  .variance-neg{ color:var(--behind); }

  /* ALLOCATION */
  .alloc-row{ display:grid; grid-template-columns:140px 1fr 90px; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line); }
  .alloc-row:last-child{ border-bottom:none; }
  .alloc-name{ font-size:13.5px; }
  .alloc-name .pct{ color:var(--text-dim); font-size:11.5px; display:block; margin-top:2px; }
  .alloc-bar-track{ height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden; }
  .alloc-bar-fill{ height:100%; background:var(--brass); }
  .alloc-row input{ width:88px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:6px 8px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:12px; text-align:right; }

  /* CONTRIBUTION LOG */
  .contrib-toggle{
    background:none; border:none; color:var(--text); cursor:pointer;
    display:flex; align-items:center; gap:8px; padding:0; font-family:inherit;
  }
  .contrib-toggle .toggle-caret{ color:var(--brass-dim); font-size:11px; }
  .log-row td{ padding:0; border-bottom:1px solid var(--line); }
  .log-panel{ background:var(--panel-2); padding:16px 20px; }
  .log-entry{ display:grid; grid-template-columns:110px 1fr 110px 28px; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .log-entry:last-child{ border-bottom:none; }
  .log-date{ color:var(--text-dim); font-family:'IBM Plex Mono', monospace; font-size:11.5px; }
  .log-note{ color:var(--text-dim); }
  .log-amount{ font-family:'IBM Plex Mono', monospace; text-align:right; }
  .log-delete{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px; justify-self:end; }
  .log-delete:hover{ color:var(--behind); }
  .log-empty{ color:var(--text-dim); font-size:12.5px; padding:8px 0; }
  .log-add{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .log-add input{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:7px 9px; border-radius:2px; font-size:12.5px; font-family:'IBM Plex Sans', sans-serif;
  }
  .log-add input[type="number"]{ width:130px; font-family:'IBM Plex Mono', monospace; }
  .log-add input[type="text"]{ flex:1; min-width:140px; }
  .log-add button{
    background:var(--brass-dim); border:none; color:var(--bg); font-weight:600;
    padding:7px 16px; border-radius:2px; cursor:pointer; font-size:12.5px;
  }
  .log-add button:hover{ background:var(--brass); }

  /* MILESTONES */
  .milestone{ display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .milestone:last-child{ border-bottom:none; }
  .milestone .mid{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--brass); padding-top:3px; width:52px; flex-shrink:0; }
  .milestone .body{ flex:1; }
  .milestone .title{ font-size:13.5px; margin-bottom:6px; line-height:1.45; }
  .milestone .controls{ display:flex; gap:10px; align-items:center; }
  .milestone select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:5px 8px; border-radius:2px; font-size:12px; font-family:'IBM Plex Sans', sans-serif;
  }
  .milestone .status-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; }
  .status-not{ background:var(--neutral); }
  .status-progress{ background:var(--brass); }
  .status-done{ background:var(--good); }

  .save-note{ position:fixed; bottom:18px; right:24px; font-size:11.5px; color:var(--text-dim); background:var(--panel); border:1px solid var(--line); padding:7px 12px; border-radius:3px; opacity:0; transition:opacity .4s ease; }
  .save-note.show{ opacity:1; }

  /* TABS */
  .tabs-nav{ display:flex; gap:2px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .tab-btn{ background:none; border:none; padding:12px 16px; color:var(--text-dim); font-size:13px; cursor:pointer; border-bottom:2px solid transparent; font-weight:500; }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--brass); }
  .tab-btn:hover:not(.active){ color:var(--text); }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; }

  /* TAB FORMS */
  .income-form{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:flex-end; }
  .income-form input, .income-form select{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:7px 8px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .income-form input:focus, .income-form select:focus{ outline:none; border-color:var(--brass-dim); }
  .income-form label{ display:flex; flex-direction:column; gap:4px; font-size:11px; }
  .income-form label span{ color:var(--text-dim); }
  .income-form button{ background:var(--brass-dim); border:none; color:var(--bg); padding:7px 14px; border-radius:2px; cursor:pointer; font-weight:600; font-size:12px; }
  .income-form button:hover{ background:var(--brass); }

  .income-table{ width:100%; border-collapse:collapse; font-size:12px; margin-bottom:16px; }
  .income-table th{ text-align:left; color:var(--text-dim); font-weight:500; padding:8px; border-bottom:1px solid var(--line); font-size:11px; }
  .income-table td{ padding:8px; border-bottom:1px solid var(--line); }
  .income-table .delete-btn{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:11px; }
  .income-table .delete-btn:hover{ color:var(--behind); }
  .income-table select, .income-table input{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:5px 6px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:11px; }

  .alloc-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  .alloc-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:2px; padding:12px; }
  .alloc-card .lbl{ font-size:11px; color:var(--text-dim); margin-bottom:4px; }
  .alloc-card .avail{ font-family:'IBM Plex Mono', monospace; font-size:15px; margin-bottom:6px; }
  .alloc-card .alloc{ font-size:10px; color:var(--text-dim); }

  .alloc-transfers{ display:flex; gap:10px; flex-direction:column; }
  .transfer-row{ display:grid; grid-template-columns:1fr 100px 140px; gap:10px; align-items:flex-end; }
  .transfer-row input{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:7px 8px; border-radius:2px; font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .transfer-row button{ background:var(--brass-dim); border:none; color:var(--bg); padding:7px 12px; border-radius:2px; cursor:pointer; font-weight:600; font-size:12px; }
  .transfer-row button:hover{ background:var(--brass); }

  .person-panel{ background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:18px; margin-bottom:16px; }
  .joint-summary{ background:var(--panel-2); border:1px solid var(--brass-dim); border-radius:3px; padding:18px; margin-top:8px; }
  .quick-allocate{ background:var(--panel-2); border:1px solid var(--brass-dim); border-radius:3px; padding:12px 14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .quick-allocate button{ background:var(--brass); border:none; color:var(--bg); padding:8px 16px; border-radius:2px; cursor:pointer; font-weight:700; font-size:12.5px; white-space:nowrap; }
  .quick-allocate button:hover{ background:var(--brass-dim); }

  /* PERSON FILTER */
  .filter-bar{ display:flex; gap:6px; margin-bottom:24px; }
  .filter-btn{ background:var(--panel); border:1px solid var(--line); color:var(--text-dim); padding:8px 16px; border-radius:20px; cursor:pointer; font-size:12.5px; font-weight:500; }
  .filter-btn.active{ background:var(--brass); border-color:var(--brass); color:var(--bg); font-weight:700; }
  .filter-btn:hover:not(.active){ border-color:var(--brass-dim); color:var(--text); }

  .placeholder{ color:var(--text-dim); font-size:14px; padding:60px 0; text-align:center; border:1px dashed var(--line); border-radius:4px; }

  @media (max-width:820px){
    .app{ flex-direction:column; }
    .nav{ width:100%; height:auto; position:relative; display:flex; overflow-x:auto; padding:14px 0; }
    .nav-brand{ display:none; }
    .pillar-item{ flex-direction:column; gap:2px; padding:10px 14px; border-left:none; border-bottom:2px solid transparent; white-space:nowrap; }
    .pillar-item.active{ border-left:none; border-bottom:2px solid var(--brass); }
    .main{ padding:28px 18px 60px 18px; }
    .grid3{ grid-template-columns:1fr; }
    .alloc-row{ grid-template-columns:1fr; gap:6px; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="nav">
    <div class="nav-brand">
      <div class="kicker">FIVE YEAR PLAN · 2027–2032</div>
      <h1>Build Yourselves,<br>Build Your Life,<br>Build Your Capital</h1>
    </div>
    <div id="nav-list"></div>
  </nav>
  <main class="main" id="main"></main>
</div>

<div class="save-note" id="saveNote">Saved</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const SUPABASE_CONFIG = window.LIFE_OS_SUPABASE;
if (!SUPABASE_CONFIG || !SUPABASE_CONFIG.url || !SUPABASE_CONFIG.publishableKey) {
  throw new Error('Supabase configuration is missing.');
}
const db = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.publishableKey);

const PILLARS = [
  { id:1, name:"Wealth & Financial Independence", short:"The Capital Engine", enabled:true },
  { id:2, name:"Career & Mastery", enabled:false },
  { id:3, name:"Business & Entrepreneurship", enabled:false },
  { id:4, name:"Voice, Influence & Public Life", enabled:false },
  { id:5, name:"Community & Relationships", enabled:false },
  { id:6, name:"Marriage & Family", enabled:false },
  { id:7, name:"Life Infrastructure", enabled:false },
  { id:8, name:"Health, Faith & Life", enabled:false },
];

const YEARS = [
  { year:1, span:"Jan 2027 – Dec 2027", monthly:14000, annual:168000, portfolio:168000, stage:"Accumulation" },
  { year:2, span:"Jan 2028 – Dec 2028", monthly:16800, annual:201600, portfolio:403200, stage:"Accumulation" },
  { year:3, span:"Jan 2029 – Dec 2029", monthly:20160, annual:241920, portfolio:725760, stage:"Growth" },
  { year:4, span:"Jan 2030 – Dec 2030", monthly:24192, annual:290304, portfolio:1161216, stage:"Growth" },
  { year:5, span:"Jan 2031 – Dec 2031", monthly:29030, annual:348365, portfolio:1741824, stage:"Growth" },
  { year:6, span:"Jan 2032 – Dec 2032", monthly:34837, annual:418038, portfolio:2508227, stage:"Income mode" },
];

const ALLOCATIONS = [
  { key:"realestate", name:"Real Estate", target:40 },
  { key:"stocks", name:"Stocks", target:30 },
  { key:"bizequity", name:"Business Equity", target:20 },
  { key:"fixedincome", name:"Fixed Income", target:10 },
];

const MILESTONES = [
  { id:"CE-01", title:"By March 2027, reach monthly income of GH¢25,000 for you and GH¢8,000 for her — a combined monthly income target of GH¢33,000." },
  { id:"CE-02", title:"Build the Capital Engine from January 2027 per the six year contribution schedule, starting at GH¢14,000/month and increasing 20% annually." },
  { id:"CE-03", title:"By December 2027, deploy GH¢168,000 across the four asset classes and establish automated contributions." },
  { id:"CE-04", title:"Build real estate exposure toward the 40% allocation: REITs and land banking first, off-plan next, direct rental once the portfolio supports it." },
  { id:"CE-05", title:"Build the stock portfolio toward 30% using Ghanaian and offshore exposure, reinvesting dividends during accumulation." },
  { id:"CE-06", title:"Build business equity exposure toward 20%, prioritising revenue generating businesses with disciplined valuation and exit criteria." },
  { id:"CE-07", title:"Maintain at least 10% of the Capital Engine in fixed income throughout the investment period." },
  { id:"CE-08", title:"Reach approximately GH¢2.5m in Capital Engine value by the end of Year 6 (2032)." },
  { id:"CE-09", title:"At the GH¢2.5m threshold, shift the engine to 70% distributed as salary replacement, 30% permanently reinvested." },
  { id:"CE-10", title:"Maintain a separate 10% tithe allocation from income, outside the 40% expense allocation." },
  { id:"CE-11", title:"Review the Capital Engine every quarter and adjust contributions if actual performance falls behind the annual trajectory." },
];

let DATA = null;
let saveTimer = null;

function defaultData(){
  return {
    transactions: [],
    allocationSnapshots: [],
    years: YEARS.reduce((acc, y) => { acc[y.year] = { portfolio: 0 }; return acc; }, {}),
    allocation: ALLOCATIONS.reduce((acc, a) => { acc[a.key] = 0; return acc; }, {}),
    milestones: MILESTONES.reduce((acc, m) => { acc[m.id] = { status: "not", notes: "" }; return acc; }, {}),
  };
}

async function loadData(){
  const { data, error } = await db
    .from('life_os_state')
    .select('data')
    .eq('id', 1)
    .single();
  if(error) throw error;
  DATA = mergeWithDefaults(data.data);
}

function mergeWithDefaults(loaded){
  const base = defaultData();
  if(!loaded || typeof loaded !== 'object') return base;

  // Already on the ledger model
  if(Array.isArray(loaded.transactions)){
    const years = {};
    YEARS.forEach(y => {
      const ly = (loaded.years && loaded.years[y.year]) || {};
      years[y.year] = { portfolio: Number(ly.portfolio) || 0 };
    });

    let allocationSnapshots;
    if(Array.isArray(loaded.allocationSnapshots)){
      allocationSnapshots = loaded.allocationSnapshots;
    }else if(loaded.allocation && typeof loaded.allocation === 'object' && Object.values(loaded.allocation).some(v => v > 0)){
      allocationSnapshots = [{
        id: 'snap-migrated', date: new Date().toISOString().split('T')[0], person: 'joint',
        realestate: loaded.allocation.realestate || 0,
        stocks: loaded.allocation.stocks || 0,
        bizequity: loaded.allocation.bizequity || 0,
        fixedincome: loaded.allocation.fixedincome || 0,
      }];
    }else{
      allocationSnapshots = [];
    }

    return {
      transactions: loaded.transactions,
      allocationSnapshots: allocationSnapshots,
      years: years,
      allocation: base.allocation,
      milestones: (loaded.milestones && typeof loaded.milestones === 'object') ? Object.assign({}, base.milestones, loaded.milestones) : base.milestones,
    };
  }

  // Migrating from the older two-source-of-truth model
  const transactions = [];
  let tid = 0;
  const nextId = () => 'm-' + (tid++) + '-' + Date.now();

  if(loaded.income && typeof loaded.income === 'object'){
    Object.keys(loaded.income).forEach(monthKeyStr => {
      (loaded.income[monthKeyStr] || []).forEach(e => {
        transactions.push({
          id: nextId(), type: 'income',
          date: e.date || (monthKeyStr + '-01'),
          person: e.person || '', source: e.source || '',
          amount: Number(e.amount) || 0,
        });
      });
    });
  }

  const years = {};
  YEARS.forEach(y => {
    const ly = loaded.years && loaded.years[y.year];
    years[y.year] = { portfolio: (ly && Number(ly.portfolio)) || 0 };
    if(ly && Array.isArray(ly.contributions)){
      ly.contributions.forEach(c => {
        transactions.push({
          id: nextId(), type: 'allocation', bucket: 'capital', planYear: y.year,
          date: c.date || (2026 + y.year) + '-01-01',
          amount: Number(c.amount) || 0,
          note: c.note || '',
        });
      });
    }else if(ly && typeof ly.contributed === 'number' && ly.contributed > 0){
      transactions.push({
        id: nextId(), type: 'allocation', bucket: 'capital', planYear: y.year,
        date: (2026 + y.year) + '-01-01',
        amount: ly.contributed,
        note: 'Carried over from previous version',
      });
    }
  });

  if(loaded.allocations && typeof loaded.allocations === 'object'){
    Object.keys(loaded.allocations).forEach(monthKeyStr => {
      const rec = loaded.allocations[monthKeyStr] || {};
      ['expenses','tithe'].forEach(bucket => {
        if(rec[bucket] > 0){
          transactions.push({
            id: nextId(), type: 'allocation', bucket: bucket,
            date: monthKeyStr + '-01',
            amount: Number(rec[bucket]) || 0,
            note: 'Migrated total',
          });
        }
      });
    });
  }

  const allocationSnapshots = (loaded.allocation && typeof loaded.allocation === 'object' && Object.values(loaded.allocation).some(v => v > 0))
    ? [{
        id: 'snap-migrated', date: new Date().toISOString().split('T')[0], person: 'joint',
        realestate: loaded.allocation.realestate || 0,
        stocks: loaded.allocation.stocks || 0,
        bizequity: loaded.allocation.bizequity || 0,
        fixedincome: loaded.allocation.fixedincome || 0,
      }]
    : [];

  return {
    transactions: transactions,
    allocationSnapshots: allocationSnapshots,
    years: years,
    allocation: base.allocation,
    milestones: (loaded.milestones && typeof loaded.milestones === 'object') ? Object.assign({}, base.milestones, loaded.milestones) : base.milestones,
  };
}

async function saveData(){
  const { error } = await db
    .from('life_os_state')
    .update({ data: DATA, updated_at: new Date().toISOString() })
    .eq('id', 1);
  if(error){
    console.error('Save failed', error);
    alert('Your change could not be saved. Please try again.');
    return;
  }
  const note = document.getElementById('saveNote');
  note.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => note.classList.remove('show'), 1200);
}

function fmt(n){
  n = Number(n) || 0;
  return 'GH¢' + n.toLocaleString('en-US', { maximumFractionDigits:0 });
}

function monthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function monthLabel(){
  const d = new Date();
  return d.toLocaleString('en-US', { month:'long', year:'numeric' });
}

function split(amount){
  amount = Number(amount) || 0;
  return {
    capital: amount * 0.5,
    expenses: amount * 0.4,
    tithe: amount * 0.1,
  };
}

function currentPlanYear(){
  const now = new Date();
  const planYear = now.getFullYear() - 2026;
  if(planYear < 1) return YEARS[0];
  if(planYear > 6) return YEARS[YEARS.length-1];
  return YEARS.find(y => y.year === planYear) || YEARS[0];
}

function monthsElapsedSincePlanStart(){
  const start = new Date(2027,0,1);
  const now = new Date();
  if(now < start) return 0;
  return Math.min(72, (now.getFullYear()-2027)*12 + now.getMonth() + 1);
}

function expectedContributionToDate(){
  const flat = [];
  YEARS.forEach(y => { for(let i=0;i<12;i++) flat.push(y.monthly); });
  const months = monthsElapsedSincePlanStart();
  return flat.slice(0, months).reduce((s,v)=>s+v, 0);
}

function pct(actual, target){
  if(!target) return 0;
  return Math.max(0, Math.min(100, (actual/target)*100));
}

/* ===== LEDGER: single source of truth for every cedi ===== */

let viewFilter = 'joint'; // 'Ant' | 'Sun' | 'joint'

function matchesFilter(t, person){
  const p = person !== undefined ? person : viewFilter;
  if(p === 'joint') return true;
  return t.person === p;
}

function filterLabel(){
  if(viewFilter === 'joint') return 'Joint';
  return viewFilter + "'s view";
}

function genId(){
  return 't-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
}

function incomeForMonth(key, person){
  return DATA.transactions.filter(t => t.type === 'income' && (t.date||'').slice(0,7) === key && matchesFilter(t, person));
}

function totalIncomeForMonth(key, person){
  return incomeForMonth(key, person).reduce((s,t) => s + (Number(t.amount)||0), 0);
}

function allocatedForMonth(key, bucket, person){
  return DATA.transactions
    .filter(t => t.type === 'allocation' && t.bucket === bucket && (t.date||'').slice(0,7) === key && matchesFilter(t, person))
    .reduce((s,t) => s + (Number(t.amount)||0), 0);
}

function contributionsForYear(year, person){
  return DATA.transactions.filter(t => t.type === 'allocation' && t.bucket === 'capital' && t.planYear === year && matchesFilter(t, person));
}

function yearContributed(year, person){
  return contributionsForYear(year, person).reduce((s,t) => s + (Number(t.amount)||0), 0);
}

function capitalForMonth(key, person){
  return DATA.transactions
    .filter(t => t.type === 'allocation' && t.bucket === 'capital' && (t.date||'').slice(0,7) === key && matchesFilter(t, person))
    .reduce((s,t) => s + (Number(t.amount)||0), 0);
}

function deleteTransaction(id){
  DATA.transactions = DATA.transactions.filter(t => t.id !== id);
}

function findTransaction(id){
  return DATA.transactions.find(t => t.id === id);
}

function confirmDelete(message){
  return confirm(message || 'Remove this? This cannot be undone.');
}

function commitCapitalTransfer(amount, note, dateStr, person){
  const year = currentPlanYear();
  DATA.transactions.push({
    id: genId(), type: 'allocation', bucket: 'capital', planYear: year.year,
    date: dateStr || new Date().toISOString().split('T')[0],
    amount, note, person,
  });
}

function wireAllocationTransfers(){
  const key = monthKey();
  const today = new Date().toISOString().split('T')[0];

  ['Ant','Sun','Joint'].forEach(person => {
    const totalIncome = totalIncomeForMonth(key, person);
    const capitalAvail = (totalIncome * 0.5) - allocatedForMonth(key, 'capital', person);
    const expensesAvail = (totalIncome * 0.4) - allocatedForMonth(key, 'expenses', person);
    const titheAvail = (totalIncome * 0.1) - allocatedForMonth(key, 'tithe', person);

    const allocateAllBtn = document.querySelector(`[data-allocate-all="${person}"]`);
    const transferCapital = document.querySelector(`[data-btn-transfer-capital="${person}"]`);
    const transferExpenses = document.querySelector(`[data-btn-transfer-expenses="${person}"]`);
    const transferTithe = document.querySelector(`[data-btn-transfer-tithe="${person}"]`);

    if(allocateAllBtn){
      allocateAllBtn.addEventListener('click', () => {
        if(capitalAvail > 0) commitCapitalTransfer(capitalAvail, 'From ' + monthLabel() + ' allocation', today, person);
        if(expensesAvail > 0) DATA.transactions.push({ id: genId(), type:'allocation', bucket:'expenses', date: today, amount: expensesAvail, note: 'From ' + monthLabel() + ' allocation', person });
        if(titheAvail > 0) DATA.transactions.push({ id: genId(), type:'allocation', bucket:'tithe', date: today, amount: titheAvail, note: 'From ' + monthLabel() + ' allocation', person });
        saveData();
        renderAllUI();
      });
    }

    if(transferCapital){
      transferCapital.addEventListener('click', () => {
        const input = document.querySelector(`[data-transfer-capital="${person}"]`);
        const amount = Number(input.value) || 0;
        if(amount <= 0 || amount > capitalAvail) { alert('Invalid amount'); return; }
        commitCapitalTransfer(amount, 'From ' + monthLabel() + ' allocation', today, person);
        saveData();
        renderAllUI();
      });
    }

    if(transferExpenses){
      transferExpenses.addEventListener('click', () => {
        const input = document.querySelector(`[data-transfer-expenses="${person}"]`);
        const amount = Number(input.value) || 0;
        if(amount <= 0 || amount > expensesAvail) { alert('Invalid amount'); return; }
        DATA.transactions.push({ id: genId(), type:'allocation', bucket:'expenses', date: today, amount, note: 'From ' + monthLabel() + ' allocation', person });
        saveData();
        renderAllUI();
      });
    }

    if(transferTithe){
      transferTithe.addEventListener('click', () => {
        const input = document.querySelector(`[data-transfer-tithe="${person}"]`);
        const amount = Number(input.value) || 0;
        if(amount <= 0 || amount > titheAvail) { alert('Invalid amount'); return; }
        DATA.transactions.push({ id: genId(), type:'allocation', bucket:'tithe', date: today, amount, note: 'From ' + monthLabel() + ' allocation', person });
        saveData();
        renderAllUI();
      });
    }
  });
}

function renderPaceNote(){
  const el = document.getElementById('pace-note');
  if(!el) return;

  const months = monthsElapsedSincePlanStart();
  if(months === 0){
    el.textContent = 'The six year window starts January 2027 — nothing to compare against yet.';
    renderYoyNote();
    return;
  }

  const expected = expectedContributionToDate();
  const actual = YEARS.reduce((s,y) => s + yearContributed(y.year), 0);
  const diff = actual - expected;

  if(diff >= 0){
    el.innerHTML = `On pace: you've contributed <span class="mono">${fmt(actual)}</span> against an expected <span class="mono">${fmt(expected)}</span> at this point, ${fmt(diff)} ahead.`;
  }else{
    el.innerHTML = `Behind pace: you've contributed <span class="mono">${fmt(actual)}</span> against an expected <span class="mono">${fmt(expected)}</span> at this point, ${fmt(Math.abs(diff))} behind.`;
  }

  renderYoyNote();
}

function monthsElapsedInPlanYear(year){
  const calYear = 2026 + year;
  const now = new Date();
  if(now.getFullYear() > calYear) return 12;
  if(now.getFullYear() < calYear) return 0;
  return now.getMonth() + 1;
}

function contributedInYearThroughMonth(year, monthsCount){
  const calYear = 2026 + year;
  return contributionsForYear(year).filter(t => {
    const d = t.date || '';
    if(!d || d.length < 7) return false;
    const y = parseInt(d.slice(0,4), 10);
    const m = parseInt(d.slice(5,7), 10);
    return y === calYear && m <= monthsCount;
  }).reduce((s,t) => s + (Number(t.amount)||0), 0);
}

function renderYoyNote(){
  const el = document.getElementById('yoy-note');
  if(!el) return;

  const cy = currentPlanYear();
  if(cy.year <= 1){
    el.textContent = '';
    return;
  }

  const elapsed = monthsElapsedInPlanYear(cy.year);
  if(elapsed === 0){
    el.textContent = '';
    return;
  }

  const thisYearSoFar = contributedInYearThroughMonth(cy.year, elapsed);
  const priorYearSoFar = contributedInYearThroughMonth(cy.year - 1, elapsed);
  const diff = thisYearSoFar - priorYearSoFar;
  const monthWord = elapsed === 1 ? 'month' : 'months';

  if(priorYearSoFar === 0 && thisYearSoFar === 0){
    el.textContent = '';
    return;
  }

  if(diff >= 0){
    el.innerHTML = `Through the first ${elapsed} ${monthWord} of Year ${cy.year}, you're <span class="mono">${fmt(diff)}</span> ahead of where Year ${cy.year-1} was at the same point.`;
  }else{
    el.innerHTML = `Through the first ${elapsed} ${monthWord} of Year ${cy.year}, you're <span class="mono">${fmt(Math.abs(diff))}</span> behind where Year ${cy.year-1} was at the same point.`;
  }
}

function latestPortfolioValue(){
  const modelled = modelledPortfolios();
  let latest = 0;
  YEARS.forEach(y => {
    const override = Number(DATA.years[y.year].portfolio) || 0;
    const val = override > 0 ? override : modelled[y.year];
    if(val > 0) latest = val;
  });
  return latest;
}

let expandedYear = null;

function modelledPortfolios(){
  let opening = 0;
  const result = {};
  YEARS.forEach(y => {
    const closing = opening * 1.2 + yearContributed(y.year);
    result[y.year] = closing;
    opening = closing;
  });
  return result;
}

    });
  });
}

function showLogin(){
  document.body.innerHTML = `
    <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#10151b;color:#e9e4d8;font-family:IBM Plex Sans,Arial,sans-serif;">
      <section style="width:min(100%,420px);padding:32px;border:1px solid #2a323d;border-radius:14px;background:#161d25;box-shadow:0 16px 50px rgba(0,0,0,.28);">
        <p style="margin:0 0 8px;color:#c39a5b;font:600 12px/1 Spectral,serif;letter-spacing:.12em;text-transform:uppercase;">Our Life OS</p>
        <h1 style="margin:0 0 10px;font:600 31px/1.15 Spectral,serif;">Welcome back</h1>
        <p style="margin:0 0 24px;color:#8b95a1;line-height:1.5;">Sign in to view and update your shared household plan.</p>
        <form id="loginForm">
          <label style="display:block;margin:0 0 7px;font-size:14px;">Email</label>
          <input id="loginEmail" type="email" autocomplete="email" required style="width:100%;padding:12px;margin:0 0 16px;border:1px solid #3a4654;border-radius:8px;background:#10151b;color:#e9e4d8;font:inherit;">
          <label style="display:block;margin:0 0 7px;font-size:14px;">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required style="width:100%;padding:12px;margin:0 0 18px;border:1px solid #3a4654;border-radius:8px;background:#10151b;color:#e9e4d8;font:inherit;">
          <p id="loginError" style="min-height:20px;margin:0 0 12px;color:#ef8a83;font-size:14px;"></p>
          <button type="submit" style="width:100%;padding:13px;border:0;border-radius:8px;background:#c39a5b;color:#10151b;font-weight:700;cursor:pointer;">Sign in</button>
        </form>
      </section>
    </main>`;

  document.getElementById('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorMessage = document.getElementById('loginError');
    errorMessage.textContent = 'Signing in…';
    const { error } = await db.auth.signInWithPassword({ email, password });
    if(error){
      errorMessage.textContent = 'That email or password did not work. Please try again.';
      return;
    }
    window.location.reload();
  });
}

async function requireLogin(){
  const { data, error } = await db.auth.getSession();
  if(error || !data.session){
    showLogin();
    return false;
  }
  return true;
}

(async function init(){
  if(!await requireLogin()) return;
  renderNav();
  DATA = defaultData();
  renderMain();
  try{
    await loadData();
    renderMain();
  }catch(e){
    console.error('Init error', e);
  }
})();
</script>
</body>
</html>
